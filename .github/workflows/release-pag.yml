name: Release

on:
  push:
    branches:
      - pag

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-stable-release
      cancel-in-progress: true
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    env:
      RELEASE_ONLY: ${{ secrets.RELEASE_ONLY }}
      NODE_AUTH_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      NPM_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      NPM_REGISTRY_URL: ${{ vars.REGISTRY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          scope: '@refinedev'
      - name: Install Dependencies & Build
        run: pnpm install
      - name: Lint
        run: pnpm lint:ci
        if: ${{ env.RELEASE_ONLY != 'true' }}
      - name: Syncpack
        run: pnpm sp lint
        if: ${{ env.RELEASE_ONLY != 'true' }}
      - name: Publint
        run: pnpm publint:all
        if: ${{ env.RELEASE_ONLY != 'true' }}
      - name: Are The Types Wrong
        run: pnpm attw:all
        if: ${{ env.RELEASE_ONLY != 'true' }}
      - name: Test
        run: pnpm test:all
        if: ${{ env.RELEASE_ONLY != 'true' }}
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm publish -r --filter '[origin/main]'
          commit: "ci(changesets): version packages"
          title: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
